name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: organize artifacts
        run: |
          mkdir -p staging/versions/sources
          find versions -path "*/build/libs/*.jar" -type f | while read jar; do
            fname="$(basename "$jar")"
            if [[ "$fname" == *-sources.jar ]]; then
              cp "$jar" "staging/versions/sources/$fname"
            else
              cp "$jar" "staging/versions/$fname"
            fi
            echo "Copied: $fname"
          done
          echo "=== staging tree ==="
          find staging/ -type f

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: staging/versions/**
          if-no-files-found: warn